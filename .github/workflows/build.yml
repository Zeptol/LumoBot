name: build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore LumoBot.sln

      - name: Build
        run: dotnet build LumoBot.sln --configuration Release --no-restore

      - name: Test question selection
        run: dotnet run --project src/Lumo.Games.SelfTest/Lumo.Games.SelfTest.csproj --configuration Release --no-build

      - name: Test catalog importer
        run: dotnet run --project src/Lumo.Importers/Lumo.Importers.csproj --configuration Release --no-build -- self-test

      - name: Test TMDB importer
        run: dotnet run --project src/Lumo.Importers.Tmdb/Lumo.Importers.Tmdb.csproj --configuration Release --no-build -- self-test

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20.x'

      - name: Install Wechaty gateway dependencies
        working-directory: gateways/wechaty
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Check Wechaty gateway syntax
        run: npm run --prefix gateways/wechaty check

      - name: Smoke test Wechaty imports
        working-directory: gateways/wechaty
        run: node --input-type=module -e "import { WechatyBuilder } from 'wechaty'; import { FileBox } from 'file-box'; if (!WechatyBuilder || !FileBox) process.exit(1)"
